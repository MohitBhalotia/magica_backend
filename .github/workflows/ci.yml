# TESTING.md §11 (DEC-035). Not yet here: integration tests (none exist yet), OpenAPI snapshot (M7),
# RULES.md cross-repo hash (needs both GitHub repos, Step 9).
# Needs: secret NEON_API_KEY, variable NEON_PROJECT_ID (the migration check runs on a Neon branch).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a main run: it may be mid-migration or mid-deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # Placeholders so env.ts validation passes during build; no step talks to these services.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci
      CLERK_SECRET_KEY: sk_test_ci
      FRONTEND_ORIGINS: http://localhost:3000
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      UPSTASH_REDIS_URL: https://ci.upstash.io
      UPSTASH_REDIS_TOKEN: ci
      TRIGGER_SECRET_KEY: tr_ci
      TRIGGER_PROJECT_REF: proj_ci
      TRANSLOADIT_KEY: ci
      TRANSLOADIT_SECRET: ci
      R2_ACCOUNT_ID: 00000000000000000000000000000000
      R2_BUCKET: ci-bucket
      R2_ACCESS_KEY_ID: ci
      R2_SECRET_ACCESS_KEY: ci
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans the full history
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      # Unit + integration tests. The int project creates a throwaway Neon branch (a copy of
      # production incl. _prisma_migrations), runs `migrate deploy` + a drift check, tests, deletes it.
      - run: pnpm test:coverage
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore
      - run: pnpm contracts:build
      - run: pnpm build
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm audit --prod --audit-level high

  # DEC-046: migrate → Trigger.dev → Vercel, in that order, only after CI passes on main.
  deploy:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations to production (expand/contract keeps old code working meanwhile)
        run: pnpm db:deploy
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
      - name: Deploy Trigger.dev tasks
        run: pnpm exec trigger deploy
        env:
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
          TRIGGER_PROJECT_REF: ${{ vars.TRIGGER_PROJECT_REF }}
          # Worker runtime secrets, pushed to Trigger.dev by syncEnvVars (trigger.config.ts).
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MAGICA_API_KEY: ${{ secrets.MAGICA_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      - name: Deploy API to Vercel (env vars come from the Vercel project)
        run: |
          pnpm dlx vercel@64.5.0 pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          pnpm dlx vercel@64.5.0 build --prod --token=${{ secrets.VERCEL_TOKEN }}
          pnpm dlx vercel@64.5.0 deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
